version: '3.8'

services:
  app:
    build:
      target: base
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-3000}"
      - "${DEBUG_HOST_PORT:-9229}:${DEBUG_CONTAINER_PORT:-9229}" # Debug port
    command: npm run dev

  database:
    ports:
      - "${POSTGRES_DEV_HOST_PORT:-5433}:${POSTGRES_CONTAINER_PORT:-5432}" # Different port for development to avoid conflicts
    environment:
      - POSTGRES_PASSWORD=postgres # Simple password for development

  # Remove nginx in development
  nginx:
    profiles:
      - disabled
