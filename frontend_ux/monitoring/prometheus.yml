global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'roofing-app'
    static_configs:
      - targets: ['app:${FRONTEND_CONTAINER_PORT:-3000}']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  - job_name: 'postgres'
    static_configs:
      - targets: ['database:${POSTGRES_CONTAINER_PORT:-5432}']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:${REDIS_CONTAINER_PORT:-6379}']
    scrape_interval: 30s

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 30s
