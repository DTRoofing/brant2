# Google Cloud Build configuration for the Brant Roofing System
# This pipeline builds, tests, and deploys the API, worker, and frontend services.

# Substitution variables for configuration.
# These can be overridden in the Cloud Build trigger settings.
substitutions:
  _REGION: 'us-central1'
  _GCR_HOSTNAME: 'us-central1-docker.pkg.dev'
  _REPO_NAME: 'brant-repo'
  _SERVICE_NAME_API: 'brant-api'
  _SERVICE_NAME_WORKER: 'brant-worker'
  _SERVICE_NAME_FRONTEND: 'brant-frontend'
  _SERVICE_ACCOUNT: 'brant-cloudbuild@brant-roofing-system-2025.iam.gserviceaccount.com'
  _VPC_CONNECTOR: 'brant-vpc-connector'
  # The _API_URL must be set in the trigger. For the first deployment, it can be a placeholder.
  # After the first deployment, set up a Load Balancer and update this variable with its URL.
  _API_URL: 'https://api.dtrooftools.com'

steps:
  # ------------------------------------------------------------------------------------
  # 0. Run Quality Gates (Unit Tests & Vulnerability Scan) with Caching
  # ------------------------------------------------------------------------------------
  - name: 'python:3.11-slim'
    id: 'quality-gate'
    entrypoint: /bin/sh
    args:
      - -c
      - |
        set -e
        # Update pip and setuptools to fix security vulnerabilities
        pip install --upgrade pip==25.2 setuptools==78.1.1
        pip install poetry pip-audit
        # Regenerate lock file if pyproject.toml has changed
        poetry lock
        poetry install --no-interaction --no-ansi
        
        echo "Running unit tests..."
        # We run pytest directly and filter for tests that are NOT marked as
        # 'integration' or 'e2e', as those require a live database.
        # Use --continue-on-collection-errors to handle import issues gracefully
        # Fail the build if any tests fail.
        poetry run pytest -m "not integration and not e2e" --continue-on-collection-errors --tb=short
        
        echo "Scanning for known vulnerabilities in dependencies..."
        # Fail the build if critical vulnerabilities are found.
        pip-audit

  # ------------------------------------------------------------------------------------
  # 1. Build and Push API Service using Kaniko for caching
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push-api'
    args:
      - '--destination=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_API}:$COMMIT_SHA'
      - '--context=.'
      - '--dockerfile=backend.Dockerfile'
      - '--cache=true'

  # ------------------------------------------------------------------------------------
  # 2. Build and Push Worker Service using Kaniko for caching
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push-worker'
    args:
      - '--destination=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_WORKER}:$COMMIT_SHA'
      - '--context=.'
      - '--dockerfile=worker.Dockerfile'
      - '--cache=true'

  # ------------------------------------------------------------------------------------
  # 3. Build and Push Frontend Service using Kaniko for caching
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push-frontend'
    args:
      - '--destination=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_FRONTEND}:$COMMIT_SHA'
      - '--context=./frontend_ux'
      - '--dockerfile=./frontend_ux/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '--target'
      - 'release'
      - '--cache=true'

  # ------------------------------------------------------------------------------------
  # 4. Deploy API Service to Cloud Run
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api-to-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME_API}'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_API}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--vpc-connector=${_VPC_CONNECTOR}'
      - '--ingress=internal-and-cloud-load-balancing' # Allow LB to access the service
      - '--set-env-vars'
      - '^--^GCP_PROJECT=${PROJECT_ID}'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest' # Mounts the 'DATABASE_URL' secret as an environment variable
    waitFor: ['build-and-push-api', 'quality-gate']

  # ------------------------------------------------------------------------------------
  # 4a. Map Custom Domain to API Service
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'map-api-domain'
    entrypoint: gcloud
    args:
      - 'run'
      - 'domain-mappings'
      - 'create'
      - '--service=${_SERVICE_NAME_API}'
      - '--domain=api.dtrooftools.com'
      - '--region=${_REGION}'
    waitFor: ['deploy-api-to-cloud-run']

  # ------------------------------------------------------------------------------------
  # 5. Run Database Migrations (Automated)
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-migration-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'brant-db-migrations' # The name of the Cloud Run Job
      - '--region=${_REGION}'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_API}:$COMMIT_SHA'
    waitFor: ['map-api-domain']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'run-migrations'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'brant-db-migrations' # The name of the Cloud Run Job
      - '--region=${_REGION}'
      - '--wait' # Wait for the job to complete
    waitFor: ['update-migration-job']

  # ------------------------------------------------------------------------------------
  # 6. Deploy Worker Service to Cloud Run
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker-to-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME_WORKER}'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_WORKER}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--vpc-connector=${_VPC_CONNECTOR}'
      - '--no-ingress' # Worker does not need an ingress endpoint
      - '--set-env-vars'
      - 'GCP_PROJECT=${PROJECT_ID}'
    # The worker depends on the database being migrated successfully.
    waitFor: ['run-migrations']

  # ------------------------------------------------------------------------------------
  # 7. Deploy Frontend Service to Cloud Run
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend-to-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME_FRONTEND}'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_FRONTEND}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform'
      - 'managed'
      # This is the public-facing UI, so it must allow unauthenticated requests
      - '--allow-unauthenticated'
    waitFor: ['build-and-push-frontend', 'quality-gate']

  # ------------------------------------------------------------------------------------
  # 7a. Map Custom Domain to Frontend Service
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'map-frontend-domain'
    entrypoint: gcloud
    args:
      - 'run'
      - 'domain-mappings'
      - 'create'
      - '--service=${_SERVICE_NAME_FRONTEND}'
      - '--domain=dtrooftools.com'
      - '--region=${_REGION}'
    waitFor: ['deploy-frontend-to-cloud-run']

# List of images to be built and pushed to Artifact Registry.
images:
  - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_API}:$COMMIT_SHA'
  - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_WORKER}:$COMMIT_SHA'
  - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_FRONTEND}:$COMMIT_SHA'

# Build options for logging and service account
options:
  # Use Cloud Logging only to avoid bucket requirements
  logging: CLOUD_LOGGING_ONLY
  # Use a machine type with more memory for faster builds
  machineType: 'E2_HIGHCPU_8'