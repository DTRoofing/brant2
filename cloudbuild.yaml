# Google Cloud Build configuration for the Brant Roofing System
# This pipeline builds, tests, and deploys the API, worker, and frontend services.

# Substitution variables for configuration.
# These can be overridden in the Cloud Build trigger settings.
substitutions:
  _REGION: 'us-central1'
  _GCR_HOSTNAME: 'us-central1-docker.pkg.dev'
  _REPO_NAME: 'brant-repo'
  _SERVICE_NAME_API: 'brant-api'
  _SERVICE_NAME_WORKER: 'brant-worker'
  _SERVICE_NAME_FRONTEND: 'brant-frontend'
  _SERVICE_ACCOUNT: 'brant-cloudbuild@brant-roofing-system-2025.iam.gserviceaccount.com'
  _VPC_CONNECTOR: 'brant-vpc-connector'
  # The _API_URL must be set in the trigger. For the first deployment, it can be a placeholder.
  # After the first deployment, set up a Load Balancer and update this variable with its URL.
  _API_URL: 'https://api.dtrooftools.com'
  _API_DOMAIN: 'api.dtrooftools.com'
  _FRONTEND_DOMAIN: 'dtrooftools.com'

steps:
  # ------------------------------------------------------------------------------------
  # 0. Run Quality Gates (Unit Tests & Vulnerability Scan) with Caching
  # ------------------------------------------------------------------------------------
  - name: 'python:3.11-slim'
    id: 'quality-gate'
    entrypoint: /bin/sh
    args:
      - -c
      - |
        set -e
        echo "Setting up Python tooling..."
        pip install --upgrade pip poetry pip-audit
        # Install into the base environment so both pytest and pip-audit see the same site-packages
        poetry config virtualenvs.create false
        # Keep lock consistent with pyproject without changing versions
        poetry lock --no-update
        # Install runtime + dev dependencies for tests
        poetry install --with dev --no-interaction --no-ansi

        echo "Running unit tests (excluding integration/e2e)..."
        poetry run pytest -m "not integration and not e2e" --tb=short

        echo "Scanning dependencies for vulnerabilities (fail only on CRITICAL)..."
        # Run pip-audit in the same environment; capture output but don't fail immediately
        set +e
        poetry run pip-audit -f json > /workspace/pip_audit.json 2>/workspace/pip_audit.err
        AUDIT_EXIT=$?
        set -e
        # Evaluate audit results to fail only on CRITICAL severity
        python - << 'PY'
import json, sys
from pathlib import Path
p = Path('/workspace/pip_audit.json')
if not p.exists():
    print('pip-audit output missing; proceeding without failing.')
    sys.exit(0)
data = json.loads(p.read_text() or '{}')
# pip-audit JSON formats vary; normalize
vulns = []
if isinstance(data, dict) and 'dependencies' in data:
    for dep in data.get('dependencies', []):
        for v in dep.get('vulns', []):
            vulns.append(v)
elif isinstance(data, list):
    vulns = data
critical = [v for v in vulns if str(v.get('severity', '')).upper() == 'CRITICAL']
if critical:
    print(f"Found {len(critical)} CRITICAL vulnerabilities; failing build.")
    sys.exit(1)
print('No CRITICAL vulnerabilities found; continuing.')
PY

  # ------------------------------------------------------------------------------------
  # 1. Build and Push API Service using Kaniko for caching
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push-api'
    args:
      - '--destination=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_API}:$COMMIT_SHA'
      - '--context=.'
      - '--dockerfile=backend.Dockerfile'
      - '--cache=true'

  # ------------------------------------------------------------------------------------
  # 2. Build and Push Worker Service using Kaniko for caching
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push-worker'
    args:
      - '--destination=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_WORKER}:$COMMIT_SHA'
      - '--context=.'
      - '--dockerfile=worker.Dockerfile'
      - '--cache=true'

  # ------------------------------------------------------------------------------------
  # 3. Build and Push Frontend Service using Kaniko for caching
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push-frontend'
    args:
      - '--destination=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_FRONTEND}:$COMMIT_SHA'
      - '--context=./frontend_ux'
      - '--dockerfile=./frontend_ux/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '--target'
      - 'release'
      - '--cache=true'

  # ------------------------------------------------------------------------------------
  # 4. Deploy API Service to Cloud Run
  # ------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api-to-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME_API}'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME_API}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--vpc-connector=${_VPC_CONNECTOR}'
      - '--ingress=internal-and-cloud-load-balancing' # Allow LB to access the service
      - '--set-env-vars'
      - '^--^GCP_PROJECT=${PROJECT_ID}'
      - '--set-secrets'
