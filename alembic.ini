# A generic Alembic configuration file.

[alembic]
# path to migration scripts
# This is corrected to point to the alembic directory inside your 'app' folder.
script_location = app/alembic

# template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# timezone for timestamps
timezone = UTC

# The database URL is set dynamically from your application's settings
# in app/alembic/env.py. This placeholder is for reference.
sqlalchemy.url = postgresql://user:pass@host/db

# Other options
# ...

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S