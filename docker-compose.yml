# ===================================================================
# COMMON SERVICE DEFINITIONS (using YAML anchors)
# ===================================================================
x-api-base: &api-base
  build:
    context: .
    dockerfile: backend.Dockerfile
  ports:
    - "3001:3001" # Expose API port
  volumes:
    - ./app:/app # Mount application code for hot-reloading
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 30s
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'
      reservations:
        memory: 256M
        cpus: '0.5'
  security_opt:
    - no-new-privileges:true
  read_only: false
  restart: unless-stopped

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: worker.Dockerfile
  volumes:
    - ./app:/app # Mount application code for hot-reloading
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "celery", "-A", "app.workers.celery_app:celery_app", "inspect", "ping"]
    interval: 30s
    timeout: 10s
    retries: 5
  deploy:
    resources:
      limits:
        memory: 6G
        cpus: '2.0'
      reservations:
        memory: 3G
        cpus: '1.0'
  security_opt:
    - no-new-privileges:true
  read_only: false
  restart: unless-stopped

x-frontend-base: &frontend-base
  # This configuration assumes the frontend Dockerfile is multi-stage,
  # with a 'development' target for local development with hot-reloading,
  # and a 'production' target for an optimized production build.
  build:
    context: ./frontend_ux
    dockerfile: Dockerfile
  ports:
    - "3000:3000"
  restart: unless-stopped

services:
  api:
    <<: *api-base
    container_name: brant-api-local
    profiles: ["local"] # This is for local .env-based development
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app
      # Mount credentials for local development against GCP
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./.env:/app/.env:ro

  frontend-local:
    <<: *frontend-base
    container_name: brant-frontend-local
    profiles: ["local"]
    build:
      context: ./frontend_ux
      dockerfile: Dockerfile
      target: development # Use the development stage from the Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # Provides the backend URL to the frontend container, fixing the hardcoded 'localhost'.
      - BACKEND_URL=http://api:3001
    volumes:
      - ./frontend_ux:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  worker:
    <<: *worker-base
    container_name: brant-worker-local
    profiles: ["local"] # This is for local .env-based development
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app
      # Mount credentials for local development against GCP
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./.env:/app/.env:ro

  # ===================================================================
  # GCP SECRET MANAGER PROFILE
  # Run with: docker-compose --profile gcp up
  # ===================================================================
  api-gcp:
    <<: *api-base
    container_name: brant-api-gcp
    profiles: ["gcp"]
    # This profile is for LOCAL DEVELOPMENT against live GCP services.
    # It uses your local gcloud ADC to authenticate.
    environment:
      # This tells the app to fetch secrets from Google Secret Manager and where to find credentials.
      - GCP_PROJECT
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp_credentials.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app
      # Mounts local gcloud credentials to a path accessible by the 'app' user.
      # You must run 'gcloud auth application-default login' on your host.
      - ~/.config/gcloud/application_default_credentials.json:/app/gcp_credentials.json:ro

  frontend-gcp:
    <<: *frontend-base
    container_name: brant-frontend-gcp
    profiles: ["gcp"]
    build:
      context: ./frontend_ux
      dockerfile: Dockerfile
      target: production # Use the production stage from the Dockerfile
    environment:
      - NODE_ENV=production
      # The frontend needs to know the backend URL for production.
      - NEXT_PUBLIC_API_URL=http://api-gcp:3001
    depends_on:
      - api-gcp

  worker-gcp:
    <<: *worker-base
    container_name: brant-worker-gcp
    profiles: ["gcp"]
    # This profile is for LOCAL DEVELOPMENT against live GCP services.
    # It uses your local gcloud ADC to authenticate.
    environment:
      # This tells the app to fetch secrets from Google Secret Manager and where to find credentials.
      - GCP_PROJECT
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp_credentials.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app
      # Mounts local gcloud credentials to a path accessible by the 'app' user.
      # You must run 'gcloud auth application-default login' on your host.
      - ~/.config/gcloud/application_default_credentials.json:/app/gcp_credentials.json:ro

  postgres:
    image: postgres:15-alpine
    container_name: brant-postgres-local
    environment:
      POSTGRES_DB: brant_roofing
      POSTGRES_USER: brant_user
      POSTGRES_PASSWORD: brant_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brant_user -d brant_roofing"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  flower:
    image: mher/flower
    ports:
      - "5555:5555"
    environment:
      # Use the internal service name for redis to avoid dependency on a potentially missing .env file.
      - CELERY_BROKER_URL=redis://redis:6379/0
    command:
      - "celery"
      - "flower"
      - "--broker=redis://redis:6379/0"
      - "--result_backend=redis://redis:6379/0"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
